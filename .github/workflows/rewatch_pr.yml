name: Validate Lambda upgrade
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest
      - run: cfn-lint templates/rewatch_aws.yml
      - run: bash scripts/package_lambda.sh
